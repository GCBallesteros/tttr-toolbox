[package]
name = "tttr-toolbox-arrays"
version = "0.5.0"
authors = ["Zhe Xian, Koong <koong898@gmail.com>"]
edition = "2018"
description = "Fast streaming algorithms for your TTTR data."
repository = "https://github.com/zak489/tttr-toolbox-arrays"
homepage = "https://github.com/zak489/tttr-toolbox-arrays"
keywords = ["scientific-computing", "science"]
license = "MIT"
readme = "README.md"

[dependencies]
num-traits = "0.2"
num-derive = "0.3"
thiserror = "1.0"
byteorder = "1"
tttr-toolbox-proc-macros = { path = "../tttr-toolbox-proc-macros", version="0.1.2" }
clap = "2.33.3"
ndarray = "0.15.2"
ndarray-npy = {version = "0.8.0", features = ["npz"]}
anyhow = "1.0.40"

[lib]
name = "tttr_toolbox"
path = "src/lib.rs"

[[bin]]
name = "tttr"
path = "src/main.rs"

