[package]
name = "tttr-toolbox-proc-macros-arrays"
version = "0.1.2"
authors = ["Zhe Xian, Koong <koong898@gmail.com>"]
edition = "2018"
description = "Proc macros for tttr-toolbox-arrays"
repository = "https://github.com/zak489/tttr-toolbox-arrays"
homepage = "https://github.com/zak489/tttr-toolbox-arrays"
license = "MIT"
keywords = ["scientific-computing", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
